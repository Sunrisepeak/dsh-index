name: Deploy index site

on:
  push:
    branches: [main]
    paths:
      - 'pkgs/**'
      - '.xpkgindex.json'
      - '.xpkgindex/**'
      - 'docs/**'
      - 'README*.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # xpkgindex replays the growth curve, history line and contributor
          # list from the git log, and silently skips all three on a shallow
          # clone -- the default depth of 1 ships a site without them.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install git+https://github.com/openxlings/xpkgindex.git
      - name: Generate static site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XPKGINDEX_BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          XPKGINDEX_BUILD_COMMIT: ${{ github.sha }}
          XPKGINDEX_BUILD_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ -z "$XPKGINDEX_BUILD_TIME" ]; then
            XPKGINDEX_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ); export XPKGINDEX_BUILD_TIME
          fi
          python3 -m xpkgindex generate . --output site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
